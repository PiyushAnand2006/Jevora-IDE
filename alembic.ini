# Alembic CLI config. The app runs migrations automatically on startup;
# use this for manual work, e.g. `alembic -c alembic.ini upgrade head`.
[alembic]
script_location = backend/db/migrations
sqlalchemy.url = sqlite:///.jevora-data/jevora.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
