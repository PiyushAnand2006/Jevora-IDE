[project]
name = "jevora-ide"
version = "0.2.0"
description = "Jevora IDE (IDE Coder) — agent-native, local-first IDE backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "langchain-core>=0.3",
  "httpx>=0.27",
  "cryptography>=42",
  "keyring>=25",
  "argon2-cffi>=23",
  "PyJWT>=2.8",
  "python-multipart>=0.0.9",
  "websockets>=12",
  "pywinpty>=2.0; sys_platform == 'win32'",
  "pypdf>=4",
  "PyYAML>=6",
  "prometheus-client>=0.20",
  "mcp>=2.2,<3",
  "playwright>=1.45",
]

[project.optional-dependencies]
laya = ["laya>=0.3.20"]
desktop = ["pyautogui>=0.9"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[project.entry-points."jevora.plugins"]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "backend/db/migrations/versions", "frontend", "workspace", "vault"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = [
  "S101",   # assert is fine in tests
  "S603",   # subprocess without shell — we pass argv lists on purpose
  "S607",   # partial executable paths (git, rg, docker) are resolved through PATH by design
  "B008",   # FastAPI Depends() in defaults
  "RUF001", "RUF002", "RUF003",  # unicode punctuation in strings/docs
  "S311",   # random for jitter, not crypto
  "ASYNC109", # explicit timeout params are part of our public APIs
  "ASYNC110",
]

[tool.ruff.lint.per-file-ignores]
"backend/config.py" = ["S105"]
"tests/**" = ["S105", "S106", "S108", "S104", "B017", "ASYNC251", "ASYNC230", "ASYNC221", "SIM105"]

[tool.mypy]
python_version = "3.11"
strict = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["backend/db/migrations/", "tests/", "workspace/", "vault/"]

[[tool.mypy.overrides]]
module = ["laya.*", "winpty.*", "pyautogui.*", "keyring.*", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 180
markers = [
  "e2e: end-to-end acceptance tests (slower)",
  "docker: requires a running Docker daemon",
  "playwright: requires Playwright browsers to be installed",
]
filterwarnings = [
  "ignore::DeprecationWarning:websockets.*",
  "ignore::DeprecationWarning:uvicorn.*",
]
