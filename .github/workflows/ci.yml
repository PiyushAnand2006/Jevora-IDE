name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check backend tests

      - name: Unit + integration tests
        # no DATABASE_URL here: tests must use their own per-test SQLite
        # (a shared database leaks state between tests)
        run: python -m pytest tests -q --ignore=tests/e2e --ignore=tests/integration/test_docker_sandbox.py --timeout=300

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install desktop deps
        run: npm install --ignore-scripts

      - name: Syntax-check shell sources
        run: node --check electron/main.js && node --check electron/backend.js && node --check electron/preload.js && node --check frontend/app.js && node --check frontend/editor.js && node --check frontend/panels.js && node --check frontend/settings.js && node --check frontend/shell.js

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Frontend e2e
        # -m "not docker": the Docker criterion needs a Linux-container daemon;
        # it skips where Docker is absent and runs in the Docker test job instead
        run: python -m pytest tests/e2e -q --timeout=600 -m "not docker"
