name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check backend tests

      - name: Unit + integration tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///test.db
        run: python -m pytest tests -q --ignore=tests/e2e --timeout=300

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install desktop deps
        run: npm install --ignore-scripts

      - name: Syntax-check shell sources
        run: node --check electron/main.js && node --check electron/backend.js && node --check electron/preload.js && node --check frontend/app.js && node --check frontend/shell.js
